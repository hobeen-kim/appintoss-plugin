name: {projectName} Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - '{projectName}/server/**'
      - '{projectName}/Dockerfile'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: {projectName}
  INFRA_REPO: hobeen-kim/jubianix-infra
  VALUES_PATH: apps/server/{projectName}/values-prod.yaml

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: {projectName}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::589794546244:role/github-actions-cicd
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: tag
        run: |
          DATE=$(date +%Y-%m-%d)
          UUID=$(cat /proc/sys/kernel/random/uuid | cut -c1-6)
          echo "IMAGE_TAG=${DATE}-${UUID}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          docker buildx build --platform linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --push .

      - name: Create infra PR to update image tag
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          cd /tmp
          git clone https://x-access-token:${GH_TOKEN}@github.com/${INFRA_REPO}.git infra
          cd infra
          BRANCH="deploy/{projectName}-${IMAGE_TAG}"
          git checkout -b "$BRANCH"
          OLD_TAG=$(grep -oP 'tag:\s*"\K[^"]+' ${VALUES_PATH} || echo "unknown")
          sed -i "s/^\(\s*\)tag: .*/\1tag: \"${IMAGE_TAG}\"/" ${VALUES_PATH}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${VALUES_PATH}
          if git diff --cached --quiet; then
            echo "No changes to commit, skipping PR"
            exit 0
          fi
          DIFF=$(git diff --cached)
          git commit -m "infra({projectName}): update image tag ${OLD_TAG} → ${IMAGE_TAG}"
          git push origin "$BRANCH"
          gh pr create \
            --repo "${INFRA_REPO}" \
            --base main \
            --head "$BRANCH" \
            --title "infra({projectName}): deploy ${IMAGE_TAG}" \
            --body "$(cat <<EOF
          ## Changes
          - **File:** \`${VALUES_PATH}\`
          - **Old tag:** \`${OLD_TAG}\`
          - **New tag:** \`${IMAGE_TAG}\`

          \`\`\`diff
          ${DIFF}
          \`\`\`
          EOF
          )"
